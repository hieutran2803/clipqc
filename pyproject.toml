[project]
name = "clipqc"
version = "0.1.0.dev0"
description = "QC gate for batches of exported videos: flags broken clips with timestamps and a CI-friendly exit code."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
clipqc = "clipqc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipqc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
